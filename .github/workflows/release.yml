name: Build and Release APK

# Triggers:
#   - pushing a tag like v3.0.0       -> builds and publishes that tag
#   - manual run (Actions tab)        -> builds and publishes the given version
#
# Native: this workflow builds libstable_diffusion_core.so FROM SOURCE (so
# edits under app/src/main/cpp take effect), then stages the rest of the
# native bundle (libdit_engine.so + qnn/dit assets) from the "native-bundle"
# release. Building the DiT engine would additionally need the Hexagon SDK;
# it is unchanged here, so the prebuilt copy is reused and Hexagon is not
# required. Set the manual switch "rebuild_native" to false to skip the
# source build and just package the prebuilt bundle as before.
#
# The QNN SDK (QAIRT) is fetched straight from Qualcomm's public software
# center URL -- no account and no self-hosted archive needed. The version is
# pinned in QNN_VERSION below and must match app/src/main/cpp/CMakeLists.txt.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for the release, without the leading v (e.g. 3.0.0-alpha.6)"
        required: true
        default: "3.0.0-alpha.6"
      rebuild_native:
        description: "Rebuild libstable_diffusion_core.so from source (downloads the QNN SDK)"
        type: boolean
        default: true

# Required to create the Release and upload the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.0.13004108"
      # Must match the QNN SDK revision CMakeLists.txt is written against.
      QNN_VERSION: "2.50.0.260828"
      # HiAI / CANN Kit DDK for MNN's hiai backend. Signed URL: refresh it from
      # https://developer.huawei.com/consumer/cn/doc/hiai-Library/ddk-download-0000001053590180
      # (sign-in required) when it expires.
      CANN_KIT_VERSION: "6.0.1.0"
      # What that package reports about itself, so a rotated URL/package shows up
      # as a warning in the build log rather than as a mystery later.
      CANN_KIT_DDK_REVISION: "HiAI_DDK_100.600.020.010"
      CANN_KIT_URL: "https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/72/v3/TBwJDEdBQLCcNiK1n-7z3g/CANN-Kit-6.0.1.0.zip?HW-CC-KV=V1&HW-CC-Date=20251222T032900Z&HW-CC-Expire=315360000&HW-CC-Sign=C7B3FE4EDCAEBD39D227B7FD2C0F244F489640CA06DC47F1F6B8C74D85384AC6"
      # tokenizers-cpp's Rust crate trips `dangerous_implicit_autorefs`, which
      # newer rustc denies by default. Pin the toolchain the project's shipped
      # libraries were actually built with (rustc path baked into the .so).
      RUST_VERSION: "1.84.0"
      # True for tag pushes, and for manual runs with the switch on.
      REBUILD_NATIVE: ${{ github.event_name != 'workflow_dispatch' || inputs.rebuild_native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # MNN measures its OpenCL GEMM tile candidates on a background thread that
      # allocates its own full-size A/B/C buffers, so the enumeration used to run
      # concurrently with the image generation and roughly doubled the peak
      # memory -- first runs at 512x512 died there. The patch makes
      # submitGemmTuneJob() wait for the measurement to finish, i.e. the
      # enumeration becomes serial with generation, with the same candidate set.
      - name: Patch MNN (serialize OpenCL GEMM tuning)
        run: |
          cd app/src/main/cpp/3rdparty/MNN
          git apply --verbose "${GITHUB_WORKSPACE}/app/src/main/cpp/patches/mnn-serialize-gemm-tuning.patch"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The android-actions/setup-android runner action fails on this image
      # ("sdkmanager tools" exits 1), so use the preinstalled SDK directly and
      # accept the licenses Gradle needs to download platforms on demand.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f ! -path '*/latest/*' 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -1)"
          fi
          echo "sdkmanager: $SDKMGR"
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "SDKMGR=$SDKMGR"
          } >> "$GITHUB_ENV"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --list_installed 2>/dev/null | head -20 || true

      # NDK + CMake + Ninja are needed by the source build; Rust is required by
      # the tokenizers-cpp submodule (it builds a Rust libtokenizers for the
      # Android target).
      - name: Install NDK, CMake, Ninja and Rust
        if: env.REBUILD_NATIVE == 'true'
        run: |
          "$SDKMGR" --install "ndk;${NDK_VERSION}" "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip
          # CMakePresets.json pins this path for the core (stable-diffusion) build.
          sudo mkdir -p /data
          sudo ln -sfn "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" /data/android-ndk-r28
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add --toolchain "${RUST_VERSION}" aarch64-linux-android
          rustc --version
          cargo --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Prebuilt libdit_engine.so plus the qnn/dit assets and licenses. The
      # core library is overwritten below when rebuilding from source.
      - name: Stage prebuilt native bundle
        env:
          NATIVE_BUNDLE_URL: ${{ secrets.NATIVE_BUNDLE_URL }}
        run: |
          url="${NATIVE_BUNDLE_URL:-https://github.com/${{ github.repository }}/releases/download/native-bundle/native-bundle.tar.gz}"
          echo "Fetching prebuilt native bundle from: $url"
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/native-bundle.tar.gz"
          tar xzf "$RUNNER_TEMP/native-bundle.tar.gz" -C app/src/main
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Download QNN SDK
        if: env.REBUILD_NATIVE == 'true'
        run: |
          url="https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QNN_VERSION}/v${QNN_VERSION}.zip"
          echo "Downloading QNN SDK ${QNN_VERSION} from $url"
          curl -fL --retry 3 --retry-delay 5 "$url" -o "$RUNNER_TEMP/qnn.zip"
          # Only the pieces the core build touches: headers, aarch64 + Hexagon
          # stub/skel libs, the SampleApp sources and the licence files. Keeps
          # the extract small enough for the runner's disk.
          rel="qairt/${QNN_VERSION}"
          unzip -q "$RUNNER_TEMP/qnn.zip" \
            "${rel}/include/*" \
            "${rel}/lib/aarch64-android/*" \
            "${rel}/lib/hexagon-v68/unsigned/*" \
            "${rel}/lib/hexagon-v69/unsigned/*" \
            "${rel}/lib/hexagon-v73/unsigned/*" \
            "${rel}/lib/hexagon-v75/unsigned/*" \
            "${rel}/lib/hexagon-v79/unsigned/*" \
            "${rel}/lib/hexagon-v81/unsigned/*" \
            "${rel}/examples/QNN/SampleApp/SampleApp/*" \
            "${rel}/LICENSE.pdf" \
            "${rel}/NOTICE.txt" \
            "${rel}/QNN_NOTICE.txt" \
            -d "$RUNNER_TEMP/qnn" || true
          rm -f "$RUNNER_TEMP/qnn.zip"
          root="$RUNNER_TEMP/qnn/${rel}"
          # Fail loudly if the SDK layout ever changes, instead of building a
          # broken core library from a half-extracted SDK.
          test -d "$root/include/QNN" || { echo "::error::QNN SDK headers missing under $root/include/QNN"; exit 1; }
          test -f "$root/lib/aarch64-android/libQnnHtp.so" || { echo "::error::QNN aarch64 libs missing under $root/lib/aarch64-android"; exit 1; }
          echo "QNN_SDK_ROOT=$root" >> "$GITHUB_ENV"
          ls "$root"

      # MNN's hiai backend needs Huawei's DDK headers and libraries in an exact
      # layout under source/backend/hiai/3rdParty. Staged before the core build,
      # and the runtime libraries are copied into jniLibs as well: the backend
      # links against libhiai.so, so the loader has to find it on device.
      #
      # The backend is compiled in so the app can offer a Kirin path next to the
      # Qualcomm one; it is only used when a request selects it.
      # Huawei's HiAI / CANN Kit DDK, needed to compile MNN's hiai backend. The
      # libraries are compiled against but never linked: src/HiaiSupport.cpp
      # provides the two symbols MNN still references directly (hiai::AiContext's
      # constructor and destructor, which its dynamic trampolines cannot cover),
      # so nothing loads Huawei's runtime unless a request selects the Kirin
      # backend. Linking them made them hard DT_NEEDEDs, and their initialisers
      # abort the process on load rather than failing gracefully.
      #
      # The runtime copies go to assets/hiailibs, which the app stages into the
      # backend's runtime directory -- the one on LD_LIBRARY_PATH -- at startup.
      #
      # The URL is signed: refresh it from
      # https://developer.huawei.com/consumer/cn/doc/hiai-Library/ddk-download-0000001053590180
      # (sign-in required) and keep CANN_KIT_VERSION in step.
      - name: Download CANN Kit DDK (HiAI)
        if: env.REBUILD_NATIVE == 'true'
        run: |
          echo "Downloading CANN Kit ${CANN_KIT_VERSION} DDK"
          # The CDN answers 403 without browser-ish headers.
          curl -fL --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Mobile Safari/537.36" \
            -e "https://developer.huawei.com/" \
            "$CANN_KIT_URL" -o "$RUNNER_TEMP/cann.zip"
          unzip -q "$RUNNER_TEMP/cann.zip" -d "$RUNNER_TEMP/cann"
          rm -f "$RUNNER_TEMP/cann.zip"
          ddk="$RUNNER_TEMP/cann/ddk/ai_ddk_lib"
          # Fail loudly rather than building a backend against half a DDK.
          test -d "$ddk/include/graph" || { echo "::error::HiAI graph headers missing"; exit 1; }
          test -f "$ddk/lib64/libhiai.so" || { echo "::error::HiAI libs missing"; exit 1; }
          # The signed URL can be rotated, and Huawei numbers the package
          # independently of the CANN Kit release ("HiAI_DDK_100.600.020.010"
          # for 6.0.1.0). Report what arrived, and warn when it is not the
          # revision the backend was written against, so a silent swap shows up
          # here instead of as a mysterious build failure later.
          package_version="$(sed -n 's/.*"VERSION":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/cann/ddk_info" | tr -d '\n')"
          echo "CANN Kit ${CANN_KIT_VERSION} package reports: ${package_version:-unknown}"
          if [ -n "${CANN_KIT_DDK_REVISION}" ] && [ "$package_version" != "$CANN_KIT_DDK_REVISION" ]; then
            echo "::warning::DDK revision changed: expected ${CANN_KIT_DDK_REVISION}, got ${package_version:-unknown}"
          fi
          hiai="app/src/main/cpp/3rdparty/MNN/source/backend/hiai/3rdParty"
          mkdir -p "$hiai/arm64-v8a" "$hiai/include"
          cp "$ddk"/lib64/*.so "$hiai/arm64-v8a/"
          cp -r "$ddk"/include/. "$hiai/include/"
          mkdir -p app/src/main/assets/hiailibs
          cp "$ddk"/lib64/*.so app/src/main/assets/hiailibs/
          echo "Staged HiAI headers:"; ls "$hiai/include" | head -5
          echo "Staged HiAI runtime libraries:"; ls app/src/main/assets/hiailibs

      - name: Build libstable_diffusion_core.so
        if: env.REBUILD_NATIVE == 'true'
        run: |
          ( cd app/src/main/cpp && bash build.sh )
          # The bundle shipped the pre-split single library; the app now picks
          # one of the two variants, so drop the stale copy to keep the APK
          # from carrying a third 12 MB build.
          rm -f app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so
          echo "Rebuilt core libraries:"
          ls -la app/src/main/jniLibs/arm64-v8a/
          sha256sum app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core_*.so

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          else
            # No stored keystore: make an ephemeral one so the build can sign.
            # The resulting APK installs but cannot update a differently
            # signed install; provide KEYSTORE_BASE64 for a stable key.
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/keystore.jks" \
              -alias localdream -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Local Dream, OU=Dev, O=LocalDream, L=City, S=State, C=CN"
          fi
          {
            echo "KS_FILE=$GITHUB_WORKSPACE/keystore.jks"
            echo "KS_PASS=${KEYSTORE_PASSWORD:-android}"
            echo "KS_ALIAS=${KEY_ALIAS:-localdream}"
            echo "KS_KEYPASS=${KEY_PASSWORD:-android}"
          } >> "$GITHUB_ENV"

      - name: Assemble basic release
        run: |
          ./gradlew --no-daemon :app:assembleBasicRelease \
            -PRELEASE_STORE_FILE="$KS_FILE" \
            -PRELEASE_STORE_PASSWORD="$KS_PASS" \
            -PRELEASE_KEY_ALIAS="$KS_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KS_KEYPASS"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Local Dream v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/basic/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
